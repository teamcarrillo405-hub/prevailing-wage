services:
  - type: web
    name: hcc-prevailing-wage
    runtime: node
    buildCommand: npm run build
    startCommand: node dist/server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/prevailing-wage.db
      - key: CORS_ORIGIN
        value: https://hcc-prevailing-wage.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_CODE
        sync: false
      - key: LOGTAIL_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: SSO_SP_CERT
        sync: false
      - key: SSO_SP_KEY
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
